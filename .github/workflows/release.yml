name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          cd dist/prebuilt
          ls -l
          zip -r ../../PartyGames.zip . -x '*.pdb'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: PartyGames.zip
          generate_release_notes: true