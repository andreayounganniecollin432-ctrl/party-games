<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Party Games · 网页测试客户端</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --panel2: #232732; --line: #2e3442;
    --text: #dfe3ec; --muted: #8b93a5; --accent: #7fb6e8; --gold: #f2c94c;
    --good: #6fdc8c; --bad: #ff7b7b; --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, button, select {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px;
  }
  input:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; background: #2b3240; }
  button:hover:not(:disabled) { background: #354055; }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button.primary { background: #2f5d8a; border-color: #3d77ad; }
  button.danger { background: #5a2f36; border-color: #7a4149; }
  button.good { background: #2f6a45; border-color: #3f8a5b; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .gold { color: var(--gold); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .title { font-size: 17px; font-weight: 600; }
  .badge { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: #2c3240; color: var(--muted); }
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .card.dead { opacity: .58; }
  .card.you { border-color: #3d77ad; }
  .card .name { font-weight: 600; }
  .card .meta { font-size: 13px; color: var(--muted); word-break: break-word; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .log {
    height: 190px; overflow-y: auto; background: #101319; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  .log div { margin: 2px 0; }
  .note { border-left: 3px solid var(--gold); padding: 6px 10px; background: #241f12; border-radius: 6px; margin: 8px 0; }
  .banner { font-size: 20px; font-weight: 700; margin: 8px 0; }
  .game { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .game:last-child { border-bottom: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Party Games</h1>
  <div class="sub">网页测试客户端 · 与 Dalamud 插件使用同一套协议，用来不开游戏也能验证玩法</div>

  <div class="panel" id="connectPanel">
    <div class="row">
      <label class="muted" for="serverInput">服务器</label>
      <input id="serverInput" size="34" />
      <label class="muted" for="nameInput">昵称</label>
      <input id="nameInput" size="12" maxlength="24" />
      <button class="primary" id="connectBtn">连接</button>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div id="main"></div>
</div>

<script>
"use strict";

const S = {
  ws: null,
  playerId: null,
  name: "",
  room: null,
  events: [],
  games: [],
  offset: 0,
  draft: "",
  chat: "",
  joinCode: "",
  maxPlayers: 8,
  online: 0,
  rooms: 0,
  onlineNames: [],
  myStats: [],
  logScroll: 0,
  status: "未连接",
};

const $ = (id) => document.getElementById(id);
const serverNow = () => Date.now() + S.offset;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("serverInput").value = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
$("nameInput").value = "玩家" + Math.floor(Math.random() * 900 + 100);

function setStatus(text) {
  S.status = text;
  $("status").textContent = text;
}

function send(type, payload) {
  if (!S.ws || S.ws.readyState !== WebSocket.OPEN) return;
  S.ws.send(JSON.stringify({ t: type, d: payload ?? null }));
}

function connect() {
  const url = $("serverInput").value.trim();
  const name = $("nameInput").value.trim() || "玩家";
  S.name = name;

  try {
    S.ws = new WebSocket(url);
  } catch (err) {
    setStatus("地址无效：" + err.message);
    return;
  }

  setStatus("连接中…");

  S.ws.onopen = () => {
    setStatus("已连接");
    send("hello", { displayName: name, protocolVersion: 1 });
  };

  S.ws.onmessage = (evt) => handle(JSON.parse(evt.data));
  S.ws.onclose = () => { setStatus("连接已断开"); S.room = null; render(); };
  S.ws.onerror = () => setStatus("连接出错");
}

function handle(frame) {
  switch (frame.t) {
    case "welcome": {
      const d = frame.d || {};
      S.playerId = d.playerId;
      S.offset = (d.serverTimeMs || Date.now()) - Date.now();
      S.games = d.games || [];
      if (d.notice) setStatus(d.notice);
      render();
      break;
    }
    case "status": {
      const d = frame.d || {};
      S.online = d.online || 0;
      S.rooms = d.rooms || 0;
      S.onlineNames = d.onlinePlayers || [];
      S.myStats = d.stats || [];
      render();
      break;
    }
    case "room": {
      const snap = frame.d || {};
      if (snap.phase === "none") { S.room = null; S.events = []; render(); break; }
      S.offset = (snap.serverTimeMs || Date.now()) - Date.now();
      if (snap.backlog && snap.backlog.length && S.events.length === 0) S.events = snap.backlog.slice();
      S.room = snap;
      render();
      break;
    }
    case "event":
      if (frame.d && frame.d.event) { S.events.push(frame.d.event); if (S.events.length > 400) S.events.shift(); renderLog(); }
      break;
    case "error":
      setStatus("错误：" + ((frame.d && frame.d.message) || "未知"));
      break;
    case "reject":
      setStatus("被拒绝：" + ((frame.d && frame.d.message) || ""));
      S.ws.close();
      break;
  }
}

function render() {
  const main = $("main");
  if (!S.ws || S.ws.readyState !== WebSocket.OPEN) { main.innerHTML = ""; return; }
  main.innerHTML = S.room ? roomHtml(S.room) : lobbyHtml();
  bindMain();
  renderLog();
}

function lobbyHtml() {
  const games = S.games.map((g) => `
    <div class="game">
      <div class="title accent">${esc(g.name)}</div>
      <div class="muted">${esc(g.blurb)}</div>
      <div class="row" style="margin-top:8px">
        <span class="muted">${g.minPlayers}-${g.maxPlayers} 人</span>
        <input type="number" min="${g.minPlayers}" max="${g.maxPlayers}" value="${Math.min(S.maxPlayers, g.maxPlayers)}" data-max="${esc(g.id)}" style="width:80px" />
        <button class="primary" data-create="${esc(g.id)}">创建房间</button>
      </div>
    </div>`).join("");

  const statRows = (S.myStats || []).map((s) => {
    const total = s.wins + s.losses;
    const cls = s.wins > s.losses ? "good" : s.losses > s.wins ? "bad" : "";
    return `<div class="${cls}">${esc(s.game)}  ${s.wins} 胜 ${s.losses} 负（共 ${total} 局）</div>`;
  }).join("");

  return `
    <div class="panel">
      <div>服务器在线 <b>${S.online}</b> 人 · ${S.rooms} 个房间</div>
      ${S.onlineNames.length ? `<div class="muted" style="margin-top:4px">在线玩家：${S.onlineNames.map(esc).join("、")}</div>` : ""}
      ${statRows ? `<div style="margin-top:8px"><div class="muted">我的战绩</div>${statRows}</div>`
                 : '<div class="muted" style="margin-top:8px">我的战绩：暂无记录（打完一局就有了）</div>'}
    </div>
    <div class="panel">
      <div class="title accent">开一局</div>
      ${games || '<div class="muted" style="margin-top:8px">服务器没有报告任何游戏。</div>'}
    </div>
    <div class="panel">
      <div class="title accent">加入房间</div>
      <div class="row" style="margin-top:8px">
        <input id="joinInput" size="8" maxlength="8" placeholder="房间码" value="${esc(S.joinCode)}" style="text-transform:uppercase" />
        <button class="primary" id="joinBtn">加入</button>
      </div>
    </div>`;
}

function roomHtml(snap) {
  const v = snap.view || {};
  const players = (v.players || []).map((p) => {
    const cls = ["card", p.isAlive === false ? "dead" : "", p.isYou ? "you" : ""].join(" ").trim();
    const bits = [];
    if (p.badge) bits.push(`<span class="badge">${esc(p.badge)}</span>`);
    if (p.votes) bits.push(`<span class="warn">${p.votes} 票</span>`);
    if (p.isOffline) bits.push(`<span class="muted">离线</span>`);
    return `
      <div class="${cls}">
        <div class="name">${esc(p.name)}${p.isYou ? "（你）" : ""} ${bits.join(" ")}</div>
        ${p.sub ? `<div class="meta">${esc(p.sub)}</div>` : ""}
      </div>`;
  }).join("");

  const actions = (v.actions || []).map((a, i) =>
    `<button ${a.enabled === false ? "disabled" : ""} class="${a.danger ? "danger" : ""}" data-action="${i}">${esc(a.label)}</button>`
  ).join("");

  const fields = (v.fields || []).map((f, i) => {
    const ro = f.editable === false ? "disabled" : "";
    if (f.kind === "bool") {
      const on = f.value === "1";
      return `<button data-field="${i}" ${ro}>${esc(f.label)}：${on ? "开" : "关"}</button>`;
    }
    const val = parseInt(f.value, 10) || 0;
    return `<span class="muted">${esc(f.label)}</span>
      <button data-field="${i}" data-dir="-1" ${ro}>−</button>
      <b>${val}</b>
      <button data-field="${i}" data-dir="1" ${ro}>+</button>`;
  }).join(" ");

  const scores = (v.scores || []).map((s, i) => {
    const delta = s.delta ? `（${s.delta > 0 ? "+" : ""}${s.delta}）` : "";
    const note = s.note ? ` <span class="gold">${esc(s.note)}</span>` : "";
    const cls = i === 0 ? "good" : s.isYou ? "accent" : "";
    return `<div class="${cls}">${i + 1}. ${esc(s.name)} <b>${s.score}</b>${delta}${note}</div>`;
  }).join("");

  return `
    <div class="panel">
      <div class="muted">${esc(snap.gameName)} · 房间 ${esc(snap.code)}</div>
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div class="title accent">${esc(v.title || "")}</div>
        <div><span class="muted">${esc(v.subtitle || "")}</span> <span id="countdown" class="warn"></span></div>
      </div>
      ${v.resultBanner ? `<div class="banner good">${esc(v.resultBanner)}</div>` : ""}
      ${v.privateNote ? `<div class="note gold">${esc(v.privateNoteLabel || "提示")}：<b>${esc(v.privateNote)}</b></div>` : ""}
      ${v.instruction ? `<div class="muted">${esc(v.instruction)}</div>` : ""}
      <div class="players" style="margin-top:10px">${players}</div>
      ${scores ? `<div style="margin-top:10px"><div class="muted">积分榜</div>${scores}</div>` : ""}
      ${(v.stats || []).length ? `<div style="margin-top:10px"><div class="muted">我的战绩</div>${(v.stats).map((s) => {
        const total = s.wins + s.losses;
        const cls = s.wins > s.losses ? "good" : s.losses > s.wins ? "bad" : "";
        return `<div class="${cls}">${esc(s.game)}  ${s.wins} 胜 ${s.losses} 负（共 ${total} 局）</div>`;
      }).join("")}</div>` : ""}
      ${actions ? `<div class="actions">${actions}</div>` : ""}
      ${fields ? `<div class="row" style="margin:8px 0">${fields}</div>` : ""}
      ${v.acceptsText ? `<div class="row"><input id="draftInput" size="52" placeholder="${esc(v.textHint || "输入…")}" value="${esc(S.draft)}" /><button class="good" id="draftBtn">提交</button></div>` : ""}
      <div class="log" id="logBox"></div>
      <div class="row" style="margin-top:10px">
        <input id="chatInput" size="52" placeholder="说点什么…" value="${esc(S.chat)}" />
        <button id="chatBtn">发送</button>
        <button class="danger" id="leaveBtn">离开房间</button>
      </div>
    </div>`;
}

function bindMain() {
  document.querySelectorAll("[data-create]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-create");
      const maxInput = document.querySelector(`[data-max="${id}"]`);
      const max = Math.max(3, Math.min(20, parseInt(maxInput.value, 10) || 8));
      S.maxPlayers = max;
      send("create", { gameId: id, maxPlayers: max });
    };
  });

  const joinBtn = $("joinBtn");
  if (joinBtn) {
    joinBtn.onclick = () => {
      const code = $("joinInput").value.trim().toUpperCase();
      if (code) send("join", { code });
    };
  }

  document.querySelectorAll("[data-action]").forEach((btn) => {
    btn.onclick = () => {
      const action = (S.room.view.actions || [])[parseInt(btn.getAttribute("data-action"), 10)];
      if (!action) return;
      send("action", { kind: action.kind, target: action.target });
    };
  });

  document.querySelectorAll("[data-field]").forEach((btn) => {
    btn.onclick = () => {
      const field = (S.room.view.fields || [])[parseInt(btn.getAttribute("data-field"), 10)];
      if (!field) return;

      let text;
      if (field.kind === "bool") {
        text = field.value === "1" ? "0" : "1";
      } else {
        const current = parseInt(field.value, 10) || 0;
        const step = parseInt(btn.getAttribute("data-dir"), 10) || 0;
        const min = field.min ?? 0;
        const max = field.max ?? 99;
        text = String(Math.max(min, Math.min(max, current + step)));
      }

      send("action", { kind: "setting", target: field.key, text });
    };
  });

  const draftBtn = $("draftBtn");
  if (draftBtn) {
    const input = $("draftInput");
    input.oninput = () => { S.draft = input.value; };
    const submit = () => {
      const text = input.value.trim();
      if (!text) return;
      send("action", { kind: S.room.view.textActionKind || "describe", text });
      S.draft = "";
      input.value = "";
    };
    draftBtn.onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  }

  const chatBtn = $("chatBtn");
  if (chatBtn) {
    const input = $("chatInput");
    input.oninput = () => { S.chat = input.value; };
    const submit = () => {
      const text = input.value.trim();
      if (!text) return;
      send("chat", { text });
      S.chat = "";
      input.value = "";
    };
    chatBtn.onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  }

  const logBox = $("logBox");
  if (logBox) {
    logBox.onscroll = () => { S.logScroll = logBox.scrollTop; };
  }

  const leaveBtn = $("leaveBtn");
  if (leaveBtn) leaveBtn.onclick = () => { send("action", { kind: "leave" }); S.room = null; S.events = []; render(); };

  tickCountdown();
}

function renderLog() {
  const box = $("logBox");
  if (!box) return;

  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  box.innerHTML = S.events.map((e) => {
    const text = e.actor ? `${e.actor}：${e.text}` : e.text;
    const cls = e.kind === "result" ? "good" : e.kind === "system" ? "muted" : "";
    return `<div class="${cls}">${esc(text)}</div>`;
  }).join("");

  // 只有原本在底部时才跟随；用户往上翻就停在原地。
  if (atBottom) box.scrollTop = box.scrollHeight;
  else box.scrollTop = S.logScroll || 0;
}

function tickCountdown() {
  const el = $("countdown");
  if (!el) return;
  const deadline = S.room && S.room.view && S.room.view.deadlineAtMs;
  if (!deadline) { el.textContent = ""; return; }
  const left = deadline - serverNow();
  el.textContent = left > 0 ? (left / 1000).toFixed(1) + "s" : "";
}

setInterval(tickCountdown, 200);
$("connectBtn").onclick = connect;
$("nameInput").onkeydown = (e) => { if (e.key === "Enter") connect(); };
</script>
</body>
</html>
